name: Push or PR

on:
  [ push, pull_request ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check
        run: |
          rustup target add x86_64-linux-android
          cargo check --target x86_64-linux-android
          cargo check --features async_tokio --target x86_64-linux-android
          cargo check --features async_tokio,async_framed --target x86_64-linux-android
          cargo check --features async_io,async_framed --target x86_64-linux-android
          cargo check --features interruptible --target x86_64-linux-android
          
          rustup target add x86_64-apple-ios
          cargo check --target x86_64-apple-ios
          cargo check --features async_tokio --target x86_64-apple-ios
          cargo check --features async_tokio,async_framed --target x86_64-apple-ios
          cargo check --features async_io,async_framed --target x86_64-apple-ios
          cargo check --features interruptible --target x86_64-apple-ios
          
          rustup target add x86_64-unknown-linux-ohos
          cargo check --target x86_64-unknown-linux-ohos
          cargo check --features async_tokio --target x86_64-unknown-linux-ohos
          cargo check --features async_tokio,async_framed --target x86_64-unknown-linux-ohos
          cargo check --features async_io,async_framed --target x86_64-unknown-linux-ohos
          cargo check --features interruptible --target x86_64-unknown-linux-ohos
          
          rustup target add x86_64-unknown-netbsd
          cargo check --target x86_64-unknown-netbsd
          cargo check --features async_tokio --target x86_64-unknown-netbsd
          cargo check --features async_tokio,async_framed --target x86_64-unknown-netbsd
          cargo check --features async_io,async_framed --target x86_64-unknown-netbsd
          cargo check --features interruptible --target x86_64-unknown-netbsd
          cargo clippy --target x86_64-unknown-netbsd  --features async_io -- -D warnings
          
          rustup target add i686-pc-windows-msvc
          cargo check --target i686-pc-windows-msvc
          cargo check --features async_tokio --target i686-pc-windows-msvc
          cargo check --features async_tokio,async_framed --target i686-pc-windows-msvc
          cargo check --features async_io,async_framed --target i686-pc-windows-msvc
          cargo check --features interruptible --target i686-pc-windows-msvc

  build_n_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: check
        if: ${{ !cancelled() }}
        run: |
          cargo check
          cargo check --features async_tokio
          cargo check --features async_tokio,async_framed
          cargo check --features async_io,async_framed
          cargo check --features interruptible
      - name: clippy
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features async_io -- -D warnings
          cargo clippy --all-targets --features async_tokio,async_framed -- -D warnings
          cargo clippy --all-targets --features interruptible -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo build --verbose --examples --tests
          cargo build --verbose --examples --tests --features async_io
          cargo build --verbose --examples --tests --features async_tokio
      - name: Documentation tests (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          cargo test --doc
          cargo test --doc --features async_tokio,async_framed
          cargo test --doc --features async_io,async_framed
      # The readiness unit tests run on pipes and socketpairs (Linux only).
      - name: Readiness tests (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        run: |
          cargo test --lib --features async_tokio -- --skip should_drop_cleanup_matches_ownership
          cargo test --lib --features async_io -- --skip should_drop_cleanup_matches_ownership
          cargo test --lib --features interruptible interrupt_pipe_is_close_on_exec
      # The `privileged_` tests remove real TUN/TAP devices from under pending
      # readers; they need root, /dev/net/tun and the `ip` tool, so they are
      # #[ignore]d elsewhere.
      - name: Prepare TUN (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y ethtool iproute2 jq
          sudo modprobe tun || true
          ls -l /dev/net/tun
      - name: Persistent offload reset regression (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          exe="$(
            cargo test --test test_dev --no-run --message-format=json |
              jq -r 'select(.executable != null and .target.name == "test_dev") | .executable' |
              tail -n1
          )"
          test -n "$exe"
          test_name=test_offload_mask_cleared_on_reattach_without_offload
          listed="$("$exe" --ignored --exact "$test_name" --list)"
          grep -Fxq "$test_name: test" <<<"$listed" || {
            echo "Regression test $test_name was not selected" >&2
            exit 1
          }
          sudo "$exe" --ignored --exact "$test_name" --test-threads=1
      - name: Deleted device wakes tokio readers (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            cargo test --lib --features async_tokio -- --ignored privileged_ --test-threads=1
      - name: Deleted device wakes async-io readers (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            cargo test --lib --features async_io -- --ignored privileged_ --test-threads=1
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "Some of jobs failed" && false

  build_n_test_freebsd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Build x86_64-FreeBSD
        uses: cross-platform-actions/action@v1.6.0
        env:
          TARGET: x86_64-unknown-freebsd
        with:
          operating_system: freebsd
          environment_variables: TARGET
          architecture: x86-64
          version: 14.2
          shell: bash
          memory: 5G
          cpu_count: 4
          run: |
            uname -a
            echo $SHELL
            pwd
            ls -lah
            whoami
            env | sort
            sudo pkg install -y git protobuf llvm15
            curl --proto 'https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            export CC=clang
            export CXX=clang++
            export CARGO_TERM_COLOR=always
            find ./
            cargo check --target x86_64-unknown-freebsd
            cargo check --features async_tokio --target x86_64-unknown-freebsd
            cargo check --features async_tokio,async_framed --target x86_64-unknown-freebsd
            cargo check --features async_io,async_framed --target x86_64-unknown-freebsd
            cargo check --features interruptible --target x86_64-unknown-freebsd
            cargo clippy --all-targets -- -D warnings
            cargo build --verbose --examples --tests
            cargo build --verbose --examples --tests --features async_io
            cargo build --verbose --examples --tests --features async_tokio

  build_n_test_openbsd:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - uses: actions/checkout@v7
      - name: Start x86_64-OpenBSD VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: openbsd
          architecture: x86-64
          version: '7.9'
          memory: 5G
          cpu_count: 4
          sync_files: runner-to-vm

      - name: Native OpenBSD validation
        run: |
          set -eu
          sudo pkg_add rust git jq
          rustc --version
          cargo --version
          export CARGO_TERM_COLOR=always

          cargo check --all-targets
          cargo check --all-targets --features async_tokio,async_framed,interruptible,experimental
          cargo check --all-targets --features async_io,async_framed,interruptible,experimental
          cargo test --lib -- --test-threads=1
          cargo test --lib --features async_tokio,async_framed,interruptible,experimental -- --test-threads=1 --skip should_drop_cleanup_matches_ownership
          cargo test --lib --features async_io,async_framed,interruptible,experimental -- --test-threads=1 --skip should_drop_cleanup_matches_ownership
          cargo test --doc

          run_integration() {
            features="$1"
            if [ -n "$features" ]; then
              executable="$(cargo test --test test_dev --no-run --features "$features" --message-format=json |
                jq -r 'select(.executable != null and .target.name == "test_dev") | .executable' |
                tail -n1)"
            else
              executable="$(cargo test --test test_dev --no-run --message-format=json |
                jq -r 'select(.executable != null and .target.name == "test_dev") | .executable' |
                tail -n1)"
            fi
            test -n "$executable"
            sudo "$executable" --test-threads=1
          }

          run_integration ""
          run_integration "async_tokio,async_framed,interruptible,experimental"

  build_n_test_netbsd:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and test x86_64-NetBSD
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: netbsd
          architecture: x86-64
          version: 10.1
          shell: bash
          memory: 5G
          cpu_count: 4
          run: |
            set -euo pipefail
            uname -a
            sudo pkgin -y install git curl clang jq
            curl --proto 'https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain 1.99.1 --profile minimal
            source "$HOME/.cargo/env"
            export CC=clang
            export CXX=clang++
            export CARGO_TERM_COLOR=always

            cargo +1.99.1 check --all-targets
            cargo +1.99.1 check --all-targets --features async_tokio,async_framed,interruptible,experimental
            cargo +1.99.1 check --all-targets --features async_io,async_framed,interruptible,experimental
            cargo +1.99.1 test --lib
            cargo +1.99.1 test --lib --features async_tokio,async_framed,interruptible,experimental
            cargo +1.99.1 test --lib --features async_io,async_framed,interruptible,experimental

            run_privileged() {
              local features="$1"
              local -a cmd=(cargo +1.99.1 test --test test_dev --no-run --message-format=json)
              if [[ -n "$features" ]]; then
                cmd+=(--features "$features")
              fi
              local exe
              exe="$("${cmd[@]}" |
                jq -r 'select(.executable != null and .target.name == "test_dev") | .executable' |
                tail -n1)"
              test -n "$exe"
              sudo "$exe" --test-threads=1
            }

            run_privileged ""
            run_privileged "async_tokio,async_framed,interruptible,experimental"
            run_privileged "async_io,async_framed,interruptible,experimental"

  build_n_test_android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install cargo ndk and rust compiler for android target
        if: ${{ !cancelled() }}
        run: |
          cargo install --locked cargo-ndk
          rustup target add x86_64-linux-android
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --target x86_64-linux-android -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo ndk -t x86_64 rustc --verbose  --features="async_tokio" --lib --crate-type=cdylib
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "Android build job failed" && false

  build_n_test_ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install cargo lipo and rust compiler for ios target
        if: ${{ !cancelled() }}
        run: |
          cargo install --locked cargo-lipo
          rustup target add x86_64-apple-ios  aarch64-apple-ios
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy  --features="async_tokio" --target x86_64-apple-ios -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo lipo --verbose  --features="async_tokio"
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "iOs build job failed" && false
  build_n_test_tvos:
    strategy:
      matrix:
        target: [aarch64-apple-tvos, aarch64-apple-tvos-sim, x86_64-apple-tvos]
      fail-fast: false
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo +nightly clippy -Zbuild-std --target ${{matrix.target}} --features="async_tokio" -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo +nightly build -Zbuild-std --verbose --target ${{matrix.target}} --features="async_tokio"
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "tvOS build job failed" && false
  build_n_test_openharmony:
    strategy:
      matrix:
        target: [aarch64-unknown-linux-ohos, armv7-unknown-linux-ohos, x86_64-unknown-linux-ohos]
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        id: setup-ohos
        with:
          version: "5.0.1"
      - name: Install ohrs and rust compiler for ohos target
        if: ${{ !cancelled() }}
        run: |
          cargo install --locked ohrs
          rustup target add ${{ matrix.target }}
      - name: fmt & clippy
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --all -- --check
          ohrs cargo --disable-target -- clippy --target ${{matrix.target}} --features="async_tokio" -- -D warnings
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "OpenHarmony build job failed" && false

  semver:
    name: Check semver
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-15, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: obi1kenobi/cargo-semver-checks-action@v2
