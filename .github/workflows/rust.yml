name: Push or PR

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: check
        run: |
          rustup target add x86_64-linux-android
          cargo check --target x86_64-linux-android
          cargo check --features async_tokio --target x86_64-linux-android
          cargo check --features async_tokio,async_framed --target x86_64-linux-android
          cargo check --features async_io,async_framed --target x86_64-linux-android
          cargo check --features interruptible --target x86_64-linux-android
          
          rustup target add x86_64-apple-ios
          cargo check --target x86_64-apple-ios
          cargo check --features async_tokio --target x86_64-apple-ios
          cargo check --features async_tokio,async_framed --target x86_64-apple-ios
          cargo check --features async_io,async_framed --target x86_64-apple-ios
          cargo check --features interruptible --target x86_64-apple-ios
          
          rustup target add x86_64-unknown-linux-ohos
          cargo check --target x86_64-unknown-linux-ohos
          cargo check --features async_tokio --target x86_64-unknown-linux-ohos
          cargo check --features async_tokio,async_framed --target x86_64-unknown-linux-ohos
          cargo check --features async_io,async_framed --target x86_64-unknown-linux-ohos
          cargo check --features interruptible --target x86_64-unknown-linux-ohos
          
          rustup target add x86_64-unknown-netbsd
          cargo check --target x86_64-unknown-netbsd
          cargo check --features async_tokio --target x86_64-unknown-netbsd
          cargo check --features async_tokio,async_framed --target x86_64-unknown-netbsd
          cargo check --features async_io,async_framed --target x86_64-unknown-netbsd
          cargo check --features interruptible --target x86_64-unknown-netbsd
          cargo clippy --target x86_64-unknown-netbsd  --features async_io -- -D warnings
          
          rustup target add i686-pc-windows-msvc
          cargo check --target i686-pc-windows-msvc
          cargo check --features async_tokio --target i686-pc-windows-msvc
          cargo check --features async_tokio,async_framed --target i686-pc-windows-msvc
          cargo check --features async_io,async_framed --target i686-pc-windows-msvc
          cargo check --features interruptible --target i686-pc-windows-msvc

  build_n_test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}

    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-C target-cpu=x86-64-v2' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # pinned
        with:
          toolchain: 1.99.1
          components: rustfmt,clippy

      - name: rustfmt
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        run: cargo +1.99.1 fmt --all -- --check

      - name: Stable compile checks
        if: ${{ !cancelled() }}
        run: |
          cargo +1.99.1 check --all-targets
          cargo +1.99.1 check --all-targets --features async_tokio,async_framed,interruptible,experimental
          cargo +1.99.1 check --all-targets --features async_io,async_framed,interruptible,experimental

      - name: Async runtime exclusivity contract
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        shell: bash
        run: |
          if cargo +1.99.1 check --no-default-features --features async_tokio,async_io; then
            echo "async_tokio + async_io unexpectedly compiled" >&2
            exit 1
          fi

      - name: Targeted Miri packet-safety checks
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && !cancelled() }}
        shell: bash
        run: |
          rustup +nightly component add miri rust-src
          cargo +nightly miri setup
          cargo +nightly miri test --lib miri_ -- --test-threads=1

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          cargo +1.99.1 test --lib
          cargo +1.99.1 test --lib --features async_tokio,async_framed,interruptible,experimental -- --skip should_drop_cleanup_matches_ownership
          cargo +1.99.1 test --lib --features async_io,async_framed,interruptible,experimental -- --skip should_drop_cleanup_matches_ownership

      - name: Documentation tests
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        run: |
          cargo +1.99.1 test --doc
          cargo +1.99.1 test --doc --features async_tokio,async_framed,interruptible,experimental
          cargo +1.99.1 test --doc --features async_io,async_framed,interruptible,experimental
      # The readiness unit tests run on pipes and socketpairs (Linux only).
      - name: Readiness tests (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        run: |
          cargo test --lib --features async_tokio -- --skip should_drop_cleanup_matches_ownership
          cargo test --lib --features async_io -- --skip should_drop_cleanup_matches_ownership
      # The `privileged_` tests remove real TUN/TAP devices from under pending
      # readers; they need root, /dev/net/tun and the `ip` tool, so they are
      # #[ignore]d elsewhere.
      - name: Prepare TUN (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        run: |
          sudo modprobe tun || true
          ls -l /dev/net/tun
      - name: Deleted device wakes tokio readers (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            cargo test --lib --features async_tokio -- --ignored privileged_ --test-threads=1
      - name: Deleted device wakes async-io readers (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 10
        run: |
          sudo -E env "PATH=$PATH" "HOME=$HOME" \
            cargo test --lib --features async_io -- --ignored privileged_ --test-threads=1
      - name: Install Linux TUN test tools
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        run: sudo apt-get update && sudo apt-get install -y ethtool iproute2

      - name: Privileged Linux TUN behavior
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          build_and_run() {
            local features="$1"
            local -a cmd=(cargo +1.99.1 test --test test_dev --no-run --message-format=json)
            if [[ -n "$features" ]]; then
              cmd+=(--features "$features")
            fi
            local exe
            exe="$("${cmd[@]}" | jq -r 'select(.executable != null and .target.name == "test_dev") | .executable' | tail -n1)"
            test -n "$exe"
            sudo "$exe" --test-threads=1
          }

          build_and_run ""
          build_and_run "async_tokio,async_framed,interruptible,experimental"
          build_and_run "async_io,async_framed,interruptible,experimental"

      - name: Persistent offload reset regression
        if: ${{ matrix.os == 'ubuntu-latest' && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          exe="$(cargo +1.99.1 test --test test_dev --no-run --message-format=json |
            jq -r 'select(.executable != null and .target.name == "test_dev") | .executable' |
            tail -n1)"
          test -n "$exe"
          sudo "$exe" --ignored --test-threads=1 test_offload_mask_cleared_on_reattach_without_offload

      - name: Abort on error
        if: ${{ failure() }}
        run: echo "Some of jobs failed" && false


  shared-sccache:
    name: Linux tests (shared sccache)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@67b13fe5fac98b5387cbbaa74ee4cff3013357c6 # main
    with:
      command: |
        cargo +1.99.1 test --lib
        cargo +1.99.1 test --lib --features async_tokio,async_framed,interruptible,experimental
        cargo +1.99.1 test --lib --features async_io,async_framed,interruptible,experimental
      rust-toolchain: "1.99.1"
      rustflags: "-C target-cpu=x86-64-v2"

  build_n_test_freebsd:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build x86_64-FreeBSD
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        env:
          TARGET: x86_64-unknown-freebsd
        with:
          operating_system: freebsd
          environment_variables: TARGET
          architecture: x86-64
          version: 14.2
          shell: bash
          memory: 5G
          cpu_count: 4
          run: |
            uname -a
            echo $SHELL
            pwd
            ls -lah
            whoami
            env | sort
            sudo pkg install -y git protobuf llvm15
            curl --proto 'https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            export CC=clang
            export CXX=clang++
            export CARGO_TERM_COLOR=always
            find ./
            cargo check --target x86_64-unknown-freebsd
            cargo check --features async_tokio --target x86_64-unknown-freebsd
            cargo check --features async_tokio,async_framed --target x86_64-unknown-freebsd
            cargo check --features async_io,async_framed --target x86_64-unknown-freebsd
            cargo check --features interruptible --target x86_64-unknown-freebsd
            cargo clippy --all-targets -- -D warnings
            cargo build --verbose --examples --tests
            cargo build --verbose --examples --tests --features async_io
            cargo build --verbose --examples --tests --features async_tokio
            cargo test --lib
            cargo test --lib --features async_tokio,async_framed,interruptible,experimental
            cargo test --lib --features async_io,async_framed,interruptible,experimental

  build_n_test_netbsd:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and test x86_64-NetBSD
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: netbsd
          architecture: x86-64
          version: 10.1
          shell: bash
          memory: 5G
          cpu_count: 4
          run: |
            set -euo pipefail
            uname -a
            sudo pkgin -y install git curl clang jq
            curl --proto 'https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain 1.99.1 --profile minimal
            source "$HOME/.cargo/env"
            export CC=clang
            export CXX=clang++
            export CARGO_TERM_COLOR=always

            cargo +1.99.1 check --all-targets
            cargo +1.99.1 check --all-targets --features async_tokio,async_framed,interruptible,experimental
            cargo +1.99.1 check --all-targets --features async_io,async_framed,interruptible,experimental
            cargo +1.99.1 test --lib
            cargo +1.99.1 test --lib --features async_tokio,async_framed,interruptible,experimental
            cargo +1.99.1 test --lib --features async_io,async_framed,interruptible,experimental

            run_privileged() {
              local features="$1"
              local -a cmd=(cargo +1.99.1 test --test test_dev --no-run --message-format=json)
              if [[ -n "$features" ]]; then
                cmd+=(--features "$features")
              fi
              local exe
              exe="$("${cmd[@]}" |
                jq -r 'select(.executable != null and .target.name == "test_dev") | .executable' |
                tail -n1)"
              test -n "$exe"
              sudo "$exe" --test-threads=1
            }

            run_privileged ""
            run_privileged "async_tokio,async_framed,interruptible,experimental"
            run_privileged "async_io,async_framed,interruptible,experimental"

  build_n_test_openbsd:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: cpa.sh {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start OpenBSD VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: openbsd
          architecture: x86-64
          version: '7.9'
          memory: 5G
          cpu_count: 4
          sync_files: runner-to-vm

      - name: Install OpenBSD Rust toolchain
        run: |
          set -eu
          uname -a
          sudo pkg_add -U rust git
          rustc --version
          cargo --version

      - name: Native OpenBSD compile checks
        run: |
          set -eu
          # OpenBSD 7.9 ships Rust 1.94.1. The crate deliberately requires
          # 1.98, so ignore only Cargo's version gate here: this job validates
          # the native OpenBSD ABI/runtime, not the declared MSRV.
          cargo check --ignore-rust-version --lib
          cargo check --ignore-rust-version --lib --features async_tokio,async_framed,interruptible,experimental
          cargo check --ignore-rust-version --lib --features async_io,async_framed,interruptible,experimental

      - name: Native OpenBSD library tests
        run: |
          set -eu
          cargo test --ignore-rust-version --lib -- --test-threads=1
          cargo test --ignore-rust-version --lib --features async_tokio,async_framed,interruptible,experimental -- --test-threads=1
          cargo test --ignore-rust-version --lib --features async_io,async_framed,interruptible,experimental -- --test-threads=1

      - name: Native OpenBSD documentation tests
        run: |
          set -eu
          cargo test --ignore-rust-version --doc
          cargo test --ignore-rust-version --doc --features async_tokio,async_framed,interruptible,experimental
          cargo test --ignore-rust-version --doc --features async_io,async_framed,interruptible,experimental

  build_n_test_android:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo ndk and rust compiler for android target
        if: ${{ !cancelled() }}
        run: |
          cargo install --locked cargo-ndk
          rustup target add x86_64-linux-android
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --target x86_64-linux-android -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo ndk -t x86_64 rustc --verbose  --features="async_tokio" --lib --crate-type=cdylib
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "Android build job failed" && false

  build_n_test_ios:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo lipo and rust compiler for ios target
        if: ${{ !cancelled() }}
        run: |
          cargo install --locked cargo-lipo
          rustup target add x86_64-apple-ios  aarch64-apple-ios
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy  --features="async_tokio" --target x86_64-apple-ios -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo lipo --verbose  --features="async_tokio"
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "iOs build job failed" && false
  build_n_test_tvos:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        target: [aarch64-apple-tvos, aarch64-apple-tvos-sim, x86_64-apple-tvos]
      fail-fast: false
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          components: clippy, rust-src
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo +nightly clippy -Zbuild-std --target ${{matrix.target}} --features="async_tokio" -- -D warnings
      - name: Build
        if: ${{ !cancelled() }}
        run: |
          cargo +nightly build -Zbuild-std --verbose --target ${{matrix.target}} --features="async_tokio"
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "tvOS build job failed" && false
  build_n_test_openharmony:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        target: [aarch64-unknown-linux-ohos, armv7-unknown-linux-ohos, x86_64-unknown-linux-ohos]
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: openharmony-rs/setup-ohos-sdk@b312caf8a43bb836aa24c08f65f97e1f09a89cad # v1.0.1
        id: setup-ohos
        with:
          version: "5.0.1"
      - name: Install ohrs and rust compiler for ohos target
        if: ${{ !cancelled() }}
        run: |
          cargo install --locked ohrs
          rustup target add ${{ matrix.target }}
      - name: fmt & clippy
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --all -- --check
          ohrs cargo --disable-target -- clippy --target ${{matrix.target}} --features="async_tokio" -- -D warnings
      - name: Abort on error
        if: ${{ failure() }}
        run: echo "OpenHarmony build job failed" && false

  semver:
    if: startsWith(github.ref, 'refs/tags/')
    name: Check semver
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-15, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          profile: minimal
          toolchain: 1.99.1
          override: true
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
